<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img">
  <title>Diagram of an A4 trim and text block</title>
  <rect width="640" height="360" fill="#f3efe6"/>
  <rect x="48" y="30" width="200" height="283" fill="#ffffff" stroke="#1c1915" stroke-width="1.5"/>
  <rect x="69" y="47" width="163" height="240" fill="none" stroke="#3f4f46" stroke-width="1.25" stroke-dasharray="4 3"/>
  <text x="300" y="64" fill="#1c1915" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700">Trim</text>
  <text x="300" y="88" fill="#5e584e" font-family="Helvetica, Arial, sans-serif" font-size="14">210 mm × 297 mm</text>
  <text x="300" y="140" fill="#1c1915" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700">Text block</text>
  <text x="300" y="164" fill="#5e584e" font-family="Helvetica, Arial, sans-serif" font-size="14">Digital margins, dashed</text>
  <text x="300" y="216" fill="#1c1915" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700">Bleed</text>
  <text x="300" y="240" fill="#5e584e" font-family="Helvetica, Arial, sans-serif" font-size="14">3 mm on the print layout.</text>
  <text x="300" y="262" fill="#5e584e" font-family="Helvetica, Arial, sans-serif" font-size="14">This diagram stays inside the trim.</text>
</svg>
